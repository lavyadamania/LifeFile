# Server
server.port=8080

# MongoDB
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/scos}

# JWT
app.jwt.secret=${JWT_SECRET:lifefile-default-secret-key-change-in-production-min-256-bits}
app.jwt.expiration-ms=${JWT_EXPIRY_MS:604800000}

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BROKER:localhost:9092}
spring.kafka.consumer.group-id=scos-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Kafka Topics
app.kafka.topic.queue-events=queue-events
app.kafka.topic.appointment-events=appointment-events

# File Uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads/

# Google GenAI
app.genai.api-key=${GEMINI_API_KEY}
app.genai.base-url=https://generativelanguage.googleapis.com/v1beta
app.genai.model=${GEMINI_MODEL:gemini-3.5-flash}

logging.level.com.lifefile=DEBUG
logging.level.org.springframework.security=DEBUG
